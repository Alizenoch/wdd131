<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papua New Guinea</title>
    <meta name="description" content="Check the weather forecast for your location, including temperature, wind speed, and conditions.">
    <meta name="author" content="Alison Hopa">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <script defer src="scripts/script.js"></script>
</head>
<body>
    <header>
        <h1>Papua New Guinea</h1>
        <nav>
            <!-- Navigation links if necessary -->
        </nav>
    </header>

    <main>
        <section class="hero">
            <picture>
                <!-- For medium screens (up to 1000px) -->
                <source srcset="week03/images/hero-large.webp" media="(max-width: 1000px)">
                <!-- For smaller screens (up to 500px) -->
                <source srcset="week03/images/hero-medium.webp" media="(max-width: 500px)">
                <!-- Fallback image for larger screens -->
                <img src="week03/images/hero-large.webp" alt="Scenic view" class="hero-image">
            </picture>
        </section>

        <section class="Data">
            <h1>Data</h1>
            <p>Population: 8,776,109</p>
            <p>Capital: Port Moresby</p>
            <p>Official Languages: English, Tok Pisin, Motu</p>
            <p>Currency: Kina (PGK)</p>
        </section>        

        <section class="weather">
            <h2>Weather ⛅</h2>
            <p>Temperature: <span id="temperature">20°C</span></p>
            <p>Wind Speed: <span id="windspeed">15 km/h</span></p>
            <p>Wind Chill: <span id="windchill">N/A</span></p>
            <!-- Mobile view icon (SVG icon) -->
            <img src="week03/images/hero.svg" alt="Weather Icon" class="weather-icon-mobile">
        </section>
    </main>

    <footer>
        <p>&copy; 2025 &#127800; Alison Hopa &#127800; Papua New Guinea</p>
        <p>Last Modification: <span id="last-modified"></span></p>
    </footer>
</body>
</html>
