<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Page</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <nav>
            <!-- Navigation links if necessary -->
        </nav>
    </header>

    <main>
        <section class="hero">
            <picture>
                <!-- For medium screens (up to 1000px) -->
                <source srcset="week03/images/hero-large.webp" media="(max-width: 1000px)">
                <!-- For smaller screens (up to 500px) -->
                <source srcset="week03/images/hero-medium.webp" media="(max-width: 500px)">
                <!-- Fallback image for larger screens -->
                <img src="week03/images/hero-large.webp" alt="Scenic view" class="hero-image">
            </picture>
        </section>
        

        <section class="weather">
            <h2>Weather ⛅</h2>
            <p>Temperature: <span id="temperature">20°C</span></p>
            <p>Wind Speed: <span id="windspeed">15 km/h</span></p>
            <p>Wind Chill: <span id="windchill">N/A</span></p>

                <!-- Mobile view icon (SVG icon) -->
    <img src="hero.svg" alt="Weather Icon" class="weather-icon-mobile">
        </section>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> Weather Info</p>
        <p>Last modified: <span id="last-modified"></span></p>
    </footer>
</body>
</html>
